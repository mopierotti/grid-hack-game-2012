name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read              # checkout
  pages: write                # publish to Pages
  id-token: write             # OIDC token deploy-pages uses to prove the run is authorized

concurrency:                  # one deploy at a time; a newer push replaces any queued deploy,
  group: pages                # but never interrupts one that's already running
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
