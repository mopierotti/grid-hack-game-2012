<!doctype html>
<html><head><meta charset="utf-8"><title>GridHack (2012 Edition)</title>
<style>html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", logLevel: "info", letterbox: "on", splashScreen: false,
  fontSources: ["fonts/IBMPlexMono-Regular.ttf", "fonts/IBMPlexMono-Bold.ttf"] };
</script>
<script src="ruffle/ruffle.js"></script>
</head><body>
<div id="c"></div>
<script>
const p = window.RufflePlayer.newest().createPlayer();
p.style.height="96vh"; p.style.width="100vh"; p.style.maxWidth="100vw";
document.getElementById("c").appendChild(p);
p.ruffle().load("GridHack.swf");
</script>
</body></html>
