<!doctype html>
<html><head><meta charset="utf-8"><title>GridHack (2012 Edition)</title>
<style>
html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}
#c{position:relative;overflow:hidden}
#c ruffle-player{display:block;position:absolute;left:0;top:0;transform-origin:0 0}
#fps{position:fixed;top:4px;left:6px;font:12px monospace;color:#8f8}
</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
// Optional tuning via URL, e.g. ?scale=1.5&quality=high&renderer=webgl&fps=1
const params = new URLSearchParams(location.search);
window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", logLevel: "error", letterbox: "on", splashScreen: false,
  fontSources: ["fonts/IBMPlexMono-Regular.ttf", "fonts/IBMPlexMono-Bold.ttf"] };
// "low" (no antialiasing) keeps older GPUs near 60 fps during busy moments; override with ?quality=high
window.RufflePlayer.config.quality = params.get("quality") || "low";                              // low | medium | high | best
if (params.get("renderer")) window.RufflePlayer.config.preferredRenderer = params.get("renderer"); // webgpu | wgpu-webgl | webgl | canvas
// Native stage is 500x480. DISPLAY caps the on-screen size. RES optionally caps the render size below it,
// with a CSS upscale to fill the gap; on an older MacBook that upscale cost more than it saved, so by
// default RES matches DISPLAY and there is no transform.
const DISPLAY = Number(params.get("scale") || 1);  // native size by default: fastest on older machines; ?scale=1.5 for larger
const RES = Number(params.get("res") || DISPLAY);
</script>
<script src="ruffle/ruffle.js"></script>
</head><body>
<div id="c"></div>
<script>
const p = window.RufflePlayer.newest().createPlayer();
const box = document.getElementById("c");
box.appendChild(p);
function layout() {
  const w = Math.min(innerWidth * 0.96, innerHeight * 0.96 * 500 / 480, 500 * DISPLAY);
  const r = Math.min(w, 500 * RES);
  box.style.width = `${w}px`; box.style.height = `${w * 480 / 500}px`;
  p.style.width = `${r}px`; p.style.height = `${r * 480 / 500}px`;
  p.style.transform = r < w ? `scale(${w / r})` : "";
}
layout();
addEventListener("resize", layout);
p.ruffle().load("GridHack.swf");
if (params.get("fps")) {  // approximate: page frames/sec; drops when Ruffle frames run long, but caps at the display refresh rate
  const el = Object.assign(document.createElement("div"), { id: "fps" }); document.body.appendChild(el);
  let n = 0, t0 = performance.now();
  (function tick(t) { n++; if (t - t0 >= 1000) { el.textContent = `${Math.round(n * 1000 / (t - t0))} fps`; n = 0; t0 = t; } requestAnimationFrame(tick); })(t0);
}
</script>
</body></html>
